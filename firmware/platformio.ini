; =============================================================================
; Timer Digital Relay v4.0 — PlatformIO configuration
; =============================================================================
; audit-fixes:
;   - Added [env:production] as default env with -DPRODUCTION_BUILD flag.
;     Production builds fail-closed on insecure defaults (TLS / auth / CORS / OTA).
;   - Use [env:development] for dev/testing without production guards.
;   - Added PubSubClient to lib_deps (was missing — build would fail).
;   - Pinned ArduinoJson to v6 (v7 removed DynamicJsonDocument/StaticJsonDocument).
; =============================================================================
[platformio]
default_envs = production
; audit-fixes: override src_dir to firmware/ root (default is firmware/src/).
;   The firmware uses a flat layout (all .cpp/.h/.ino at root) for Arduino IDE
;   compatibility. PlatformIO's default expects src/, so we override here.
src_dir = .

; ---------- Common flags shared by all envs ----------
[common]
build_flags =
  -std=gnu++17
  -DCORE_DEBUG_LEVEL=3
  -DBOARD_HAS_PSRAM=0
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=0
  ; AUD-FW-OTA-001 (2026-08-20): MQTT OTA via Ed25519 is NON-FUNCTIONAL in the
  ;   default prebuilt arduino-esp32 framework because PSA Crypto headers have
  ;   C++ compatibility issues (psa_status_t not resolved in macro expansion).
  ;   The -DMBEDTLS_ED25519_SUPPORTED flag enables the code path but causes
  ;   compile errors. To enable MQTT OTA, you must either:
  ;   (a) Rebuild the ESP-IDF framework with CONFIG_MBEDTLS_ECP_DP_ED25519_ENABLED=y
  ;       AND fix the PSA Crypto header C++ compatibility (extern "C" + typedef ordering)
  ;   (b) Switch to a self-contained Ed25519 library (e.g., ed25519-donna) — TODO
  ;   (c) Use REST OTA (HTTP upload via /api/ota) which does NOT require Ed25519 —
  ;       this is the DEFAULT and SUPPORTED OTA path.
  ; The firmware's ed25519VerifyHash() returns false (fail-closed) without this flag.
  ; MQTT OTA will be rejected. REST OTA remains fully functional.
lib_deps =
  adafruit/RTClib@^2.1.4
  bblanchon/ArduinoJson@^6.19.0
  knolleary/PubSubClient@^2.8
  ; LittleFS is bundled with the ESP32 Arduino core (no separate lib_dep).
  ; mbedtls is bundled with esp32 platform — no separate dep needed
  ; Preferences is part of ESP32 core

; ---------- DEVELOPMENT env ----------
[env:development]
platform = espressif32@^6.5.0
board = esp32dev
board_build.mcu = esp32
board_build.f_cpu = 240000000L
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = partitions_ota_1mb5.csv
build_flags =
  ${common.build_flags}
  -DDEVELOPMENT_BUILD
  -DBATTERY_MONITORING_ENABLED
lib_deps = ${common.lib_deps}
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600

; ---------- STAGING env ----------
[env:staging]
platform = espressif32@^6.5.0
board = esp32dev
board_build.mcu = esp32
board_build.f_cpu = 240000000L
