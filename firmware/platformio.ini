; =============================================================================
; Timer Digital Relay v4.0 — PlatformIO configuration
; =============================================================================
; audit-fixes:
;   - Added [env:production] as default env with -DPRODUCTION_BUILD flag.
;     Production builds fail-closed on insecure defaults (TLS / auth / CORS / OTA).
;   - Use [env:development] for dev/testing without production guards.
;   - Added PubSubClient to lib_deps (was missing — build would fail).
;   - Pinned ArduinoJson to v6 (v7 removed DynamicJsonDocument/StaticJsonDocument).
; =============================================================================
[platformio]
default_envs = production
; audit-fixes: override src_dir to firmware/ root (default is firmware/src/).
;   The firmware uses a flat layout (all .cpp/.h/.ino at root) for Arduino IDE
;   compatibility. PlatformIO's default expects src/, so we override here.
src_dir = .
; P2-1: exclude test/host/ from ESP32 build — these files use host-only shims
; (Preferences.h, Arduino.h) and must not be compiled for the device.
; They are built separately by the host test harness (firmware/test/host/Makefile.tj).
; PlatformIO's src_filter is the canonical way to include/exclude globs.
build_dir = .pio/build

; ---------- Common flags shared by all envs ----------
[common]
build_flags =
  -std=gnu++17
  -DCORE_DEBUG_LEVEL=3
  -DBOARD_HAS_PSRAM=0
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=0
  ; audit-fixes: PSA Crypto Ed25519 support is NOT included in the prebuilt
  ;   arduino-esp32 framework by default. To enable, you must rebuild the
  ;   framework with CONFIG_MBEDTLS_ECP_DP_ED25519_ENABLED=y in sdkconfig
  ;   (see firmware README "Known Limitations #3"), then add:
  ;
  ;     -DMBEDTLS_ED25519_SUPPORTED
  ;
  ;   to build_flags here. Without it, ed25519VerifyHash() returns false
  ;   (fail-closed) and MQTT OTA is rejected.
; P2-1: src_filter excludes test/host/ from ESP32 build (host-only files use shims)
src_filter = +<*> -<test/host/>
lib_deps =
  adafruit/RTClib@^2.1.4
  bblanchon/ArduinoJson@^6.19.0
  knolleary/PubSubClient@^2.8
  ; LittleFS is bundled with the ESP32 Arduino core (no separate lib_dep).
  ; mbedtls is bundled with esp32 platform — no separate dep needed
  ; Preferences is part of ESP32 core

; ---------- DEVELOPMENT env ----------
; Insecure defaults (HiveMQ public broker, no auth, CORS *). For local
; testing only — do NOT flash to a device controlling 220V mains.
[env:development]
platform = espressif32@^6.5.0
board = esp32dev
board_build.mcu = esp32
board_build.f_cpu = 240000000L
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = default.csv
build_src_filter = ${common.src_filter}
build_flags =
  ${common.build_flags}
lib_deps = ${common.lib_deps}
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600

; ---------- PRODUCTION env (DEFAULT) ----------
; Fail-closed: PRODUCTION_BUILD flag forces TLS + auth + CA + CORS + OTA guards.
; Config.h MUST be edited with real broker host, CA, username, password, and
; Ed25519 OTA public key before flashing — firmware refuses to boot otherwise.
[env:production]
platform = espressif32@^6.5.0
board = esp32dev
board_build.mcu = esp32
board_build.f_cpu = 240000000L
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = default.csv
build_src_filter = ${common.src_filter}
build_flags =
  ${common.build_flags}
  -DPRODUCTION_BUILD
lib_deps = ${common.lib_deps}
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600

; ---------- Backward-compat alias (existing scripts may use env:esp32dev) ----------
; Maps to development env so old `pio run -e esp32dev` commands still work.
[env:esp32dev]
platform = espressif32@^6.5.0
board = esp32dev
board_build.mcu = esp32
board_build.f_cpu = 240000000L
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = default.csv
build_src_filter = ${common.src_filter}
build_flags = ${common.build_flags}
lib_deps = ${common.lib_deps}
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600

; ---------- OTA remote upload (for future use) ----------
; upload_protocol = espota
; upload_port = 192.168.4.1
; upload_flags = --port=3232 --auth=Timer12OTA

; ---------- Extra scripts ----------
; extra_scripts = pre:tools/pre_build.py
