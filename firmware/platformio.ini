; =============================================================================
; Timer Digital Relay v4.0 — PlatformIO configuration
; =============================================================================
[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@^6.5.0
board = esp32dev
board_build.mcu = esp32
board_build.f_cpu = 240000000L
framework = arduino

; ---------- File system ----------
board_build.filesystem = littlefs
board_build.partitions = default.csv

; ---------- Source layout (modular) ----------
; src/ contains Core/, Drivers/, Services/, Storage/, Network/, Web/, Utils/, AI/
build_src_filter = +<*> +<../src/*>

; ---------- Build flags ----------
build_flags =
  -std=gnu++17
  -DCORE_DEBUG_LEVEL=3
  -DBOARD_HAS_PSRAM=0
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=0
  ; Per Engineering Brief: signing key for OTA binary
  ; -DSIGNING_KEY="${sysenv.OTA_SIGNING_KEY}"

; ---------- Libraries (per Engineering Brief dependencies) ----------
lib_deps =
  adafruit/RTClib@^2.1.4
  bblanchon/ArduinoJson@^7.0.0
  esp32-arduino-libs/LittleFS@^3.0.0
  ; mbedtls is bundled with esp32 platform — no separate dep needed
  ; Preferences is part of ESP32 core

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

upload_speed = 921600

; ---------- OTA (for future remote upload via network) ----------
; upload_protocol = espota
; upload_port = 192.168.4.1
; upload_flags = --port=3232 --auth=Timer12OTA

; ---------- Extra scripts ----------
; extra_scripts = pre:tools/pre_build.py
